cases:
- id: sshd.password.ipv4
  service: openssh
  rule: sshd
  format: syslog
  reference: https://github.com/fail2ban/fail2ban/tree/master/fail2ban/tests/files/logs
  tags:
  - positive
  - ipv4
  - core
  lines:
  - 'Aug  6 19:00:01 host sshd[1234]: Failed password for invalid user root from 198.51.100.20 port 51000 ssh2'
  repeat: 3
  expected_ip: 198.51.100.20
  expected_matches: 3
  expected_bans: 1
