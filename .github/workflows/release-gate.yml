name: Release gate

on:
  workflow_dispatch:
  push:
    branches:
      - 'release/**'
    tags:
      - 'v*.*.*'
  schedule:
    - cron: '17 3 * * 1'

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  non-privileged:
    name: static, race, fixtures, fault repetition
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true
      - name: Install MAC validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y apparmor-utils
      - name: Verify release
        run: make verify-release
      - name: Chaos and fuzz gate
        run: FUZZTIME=60s make test-chaos
      - name: Compile SELinux policy on Fedora
        run: test/security/selinux-container.sh
      - name: Generated corpus exact-count gate
        run: LINES=250000 test/corpus/generate.sh /tmp/goban-release-corpus.log

  kernel:
    name: kernel ${{ matrix.backend }} ${{ matrix.path }} IPv${{ matrix.family }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [iptables, nftables]
        path: [input, forward]
        family: [4, 6]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true
      - name: Install kernel test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ipset nftables iptables curl python3
      - name: Build
        run: make build
      - name: End-to-end enforcement
        run: sudo test/integration/kernel/run.sh '${{ matrix.backend }}' '${{ matrix.path }}' '${{ matrix.family }}'

  packages:
    name: deb, rpm, Arch install smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true
      - name: Install nfpm
        run: |
          mkdir -p "$RUNNER_TEMP/nfpm-bin"
          GOBIN="$RUNNER_TEMP/nfpm-bin" \
            go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0
          echo "$RUNNER_TEMP/nfpm-bin" >> "$GITHUB_PATH"
      - name: Package smoke
        run: make package-smoke VERSION=1.0.0-rc1
      - name: Upgrade preservation smoke
        run: test/integration/package/upgrade.sh
