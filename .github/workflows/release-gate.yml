name: Release gate

on:
  workflow_dispatch:
  push:
    branches:
      - 'release/**'
    tags:
      - 'v*.*.*'
  schedule:
    - cron: '17 3 * * 1'

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  non-privileged:
    name: static, race, fixtures, fault repetition
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true
      - name: Verify release
        run: make verify-release
      - name: Repeated lifecycle and fault tests
        run: make test-fault
      - name: Transactional reload stress
        run: make test-reload

  kernel:
    name: kernel ${{ matrix.backend }} ${{ matrix.path }} IPv${{ matrix.family }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [iptables, nftables]
        path: [input, forward]
        family: [4, 6]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true
      - name: Install kernel test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ipset nftables iptables curl python3
      - name: Build
        run: make build
      - name: End-to-end enforcement
        run: sudo test/integration/kernel/run.sh '${{ matrix.backend }}' '${{ matrix.path }}' '${{ matrix.family }}'

  packages:
    name: deb, rpm, Arch install smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true
      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.43.4
      - name: Package smoke
        run: make package-smoke VERSION=1.0.0-rc1
