# GoBan tagged-release workflow.
#
# Stable tags:
#   v1.0.0
#   - publish a normal GitHub Release
#   - publish GHCR tags v1.0.0, 1.0.0, 1.0, and latest
#
# Pre-release tags:
#   v1.0.0-rc.1
#   - publish a GitHub pre-release
#   - publish GHCR tags v1.0.0-rc.1 and 1.0.0-rc.1
#   - NEVER move the latest container tag
#
# Publication is fail-closed behind the release verification, privileged
# kernel matrix, and package lifecycle smoke jobs. The release job stages all
# downloadable files into one flat directory before generating SHA256SUMS so
# `sha256sum -c SHA256SUMS` works exactly as documented after users download
# the assets from GitHub Releases.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NFPM_VERSION: '2.47.0'
  IMAGE_NAME: ghcr.io/izm1chael/goban

jobs:
  metadata:
    name: validate release tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      channel: ${{ steps.release.outputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate semver tag and classify release
        id: release
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          scripts/release-tag-metadata.sh "$TAG" | tee -a "$GITHUB_OUTPUT"

  verify:
    name: release-candidate verification
    runs-on: ubuntu-latest
    needs: metadata
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26'
          cache: true
      - name: Install MAC validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y apparmor-utils
      - name: Static, race, fixtures, invariants, and chaos gates
        run: |
          make verify-release
          FUZZTIME=60s make test-chaos
      - name: Compile SELinux policy on Fedora
        run: test/security/selinux-container.sh

  kernel:
    name: kernel ${{ matrix.backend }} ${{ matrix.path }} IPv${{ matrix.family }}
    runs-on: ubuntu-latest
    needs: [metadata, verify]
    strategy:
      fail-fast: false
      matrix:
        backend: [iptables, nftables]
        path: [input, forward]
        family: [4, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26'
          cache: true
      - name: Install kernel test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ipset nftables iptables curl python3
      - name: Build
        run: make build
      - name: End-to-end enforcement, drift repair, and TTL refresh
        run: sudo test/integration/kernel/run.sh '${{ matrix.backend }}' '${{ matrix.path }}' '${{ matrix.family }}'

  package-smoke:
    name: package install / lifecycle smoke
    runs-on: ubuntu-latest
    needs: [metadata, verify]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26'
          cache: true
      - name: Install nfpm
        run: |
          mkdir -p "$RUNNER_TEMP/nfpm-bin"
          GOBIN="$RUNNER_TEMP/nfpm-bin" go install "github.com/goreleaser/nfpm/v2/cmd/nfpm@v${NFPM_VERSION}"
          echo "$RUNNER_TEMP/nfpm-bin" >> "$GITHUB_PATH"
      - name: Package install and lifecycle smoke
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: make package-smoke VERSION="$VERSION"

  packages:
    name: build packages (${{ matrix.arch }})
    runs-on: ubuntu-latest
    needs: [metadata, verify]
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26'
          cache: true

      - name: Build binaries
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          mkdir -p bin
          CGO_ENABLED=0 GOOS=linux GOARCH="$ARCH" \
            go build -trimpath -ldflags="-s -w -X main.version=$VERSION" \
            -o bin/goban-daemon ./cmd/goban-daemon
          CGO_ENABLED=0 GOOS=linux GOARCH="$ARCH" \
            go build -trimpath -ldflags="-s -w -X main.version=$VERSION" \
            -o bin/goban-enforcer ./cmd/goban-enforcer
          CGO_ENABLED=0 GOOS=linux GOARCH="$ARCH" \
            go build -trimpath -ldflags="-s -w -X main.version=$VERSION" \
            -o bin/goban-client ./cmd/goban-client
          CGO_ENABLED=0 GOOS=linux GOARCH="$ARCH" \
            go build -trimpath -ldflags="-s -w -X main.version=$VERSION" \
            -o bin/goban-corpus ./cmd/goban-corpus
          CGO_ENABLED=0 GOOS=linux GOARCH="$ARCH" \
            go build -trimpath -ldflags="-s -w -X main.version=$VERSION" \
            -o bin/goban-soak ./cmd/goban-soak

      - name: Verify release binary identity
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          test "$(bin/goban-daemon --version)" = "$VERSION"
          test "$(bin/goban-enforcer --version)" = "$VERSION"
          test "$(bin/goban-client version)" = "$VERSION"
          test "$(bin/goban-corpus version)" = "$VERSION"
          test "$(bin/goban-soak version)" = "$VERSION"

      - name: Install nfpm
        run: |
          mkdir -p "$RUNNER_TEMP/nfpm-bin"
          GOBIN="$RUNNER_TEMP/nfpm-bin" \
            go install "github.com/goreleaser/nfpm/v2/cmd/nfpm@v${NFPM_VERSION}"
          echo "$RUNNER_TEMP/nfpm-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/nfpm-bin/nfpm" --version | head -2

      - name: Gzip man pages
        run: |
          gzip -fk man/goban-daemon.8
          gzip -fk man/goban-enforcer.8
          gzip -fk man/goban-client.1
          gzip -fk man/goban-soak.1

      - name: Build .deb, .rpm, .pkg.tar.zst
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          mkdir -p dist
          cd packaging
          for fmt in deb rpm archlinux; do
            nfpm pkg --packager "$fmt" --config nfpm.yaml --target ../dist/
          done
          ls -lh ../dist/

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: ./bin
          format: spdx-json
          output-file: dist/goban-${{ needs.metadata.outputs.version }}-${{ matrix.arch }}.spdx.json

      - name: Rename binaries for release attachment
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          mv bin/goban-daemon "bin/goban-daemon-linux-$ARCH"
          mv bin/goban-enforcer "bin/goban-enforcer-linux-$ARCH"
          mv bin/goban-client "bin/goban-client-linux-$ARCH"
          mv bin/goban-corpus "bin/goban-corpus-linux-$ARCH"
          mv bin/goban-soak "bin/goban-soak-linux-$ARCH"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packages-${{ matrix.arch }}
          path: |
            dist/
            bin/goban-daemon-linux-${{ matrix.arch }}
            bin/goban-enforcer-linux-${{ matrix.arch }}
            bin/goban-client-linux-${{ matrix.arch }}
            bin/goban-corpus-linux-${{ matrix.arch }}
            bin/goban-soak-linux-${{ matrix.arch }}
          retention-days: 7

  docker:
    name: multi-arch docker image
    runs-on: ubuntu-latest
    needs: [metadata, packages, kernel, package-smoke]
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE_NAME }}
          # metadata-action normally creates latest automatically for semver.
          # Disable it here. Stable latest is promoted only after the GitHub
          # Release has been successfully created.
          flavor: latest=false
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ needs.metadata.outputs.prerelease == 'false' }}

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push multi-arch image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ needs.metadata.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign container digest with keyless OIDC
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE_NAME}@${DIGEST}"

      - name: Verify pushed image version
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          docker pull "${IMAGE_NAME}@${DIGEST}"
          test "$(docker run --rm "${IMAGE_NAME}@${DIGEST}" --version)" = "$VERSION"

      - name: Record immutable image reference
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p release-docker
          printf '%s@%s\n' "$IMAGE_NAME" "$DIGEST" > release-docker/docker-image.txt
          cat release-docker/docker-image.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-docker
          path: release-docker/docker-image.txt
          retention-days: 7

  release:
    name: github release
    runs-on: ubuntu-latest
    needs: [metadata, packages, docker, kernel, package-smoke]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download package/binary artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts/packages
          pattern: packages-*
          merge-multiple: true

      - name: Download container digest artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-docker
          path: artifacts/docker

      - name: Stage, validate, and checksum flat public release assets
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          CHANNEL: ${{ needs.metadata.outputs.channel }}
        run: |
          scripts/stage-release-assets.sh \
            artifacts/packages artifacts/docker/docker-image.txt release-assets \
            "${{ github.ref_name }}" "$VERSION" "$CHANNEL" "${{ github.sha }}"
          cat release-assets/SHA256SUMS
          ls -lh release-assets

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign checksum manifest with keyless OIDC
        working-directory: release-assets
        run: cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS

      - name: Attest release artifacts
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: release-assets/*

      - name: Build release introduction
        shell: bash
        env:
          PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          if [[ "$PRERELEASE" == "true" ]]; then
            cat > release-body.md <<EOF
          > **Pre-release:** GoBan ${VERSION} is a 1.0 release candidate. It does not move the GHCR \`latest\` tag. Please report deployment or compatibility issues before using it as a production replacement.

          ## Install

          Download the package matching your distribution and architecture from the assets below, then run \`goban-client doctor --probe\` after configuration.

          The release includes amd64/arm64 standalone binaries, Debian/RPM/Arch packages, SPDX SBOMs, a signed SHA-256 manifest, and an immutable container digest reference.
          EOF
          else
            cat > release-body.md <<EOF
          GoBan ${VERSION} is a stable release. The GHCR \`latest\` tag is updated only by stable releases.

          ## Install

          Download the package matching your distribution and architecture from the assets below, then run \`goban-client doctor --probe\` after configuration.

          The release includes amd64/arm64 standalone binaries, Debian/RPM/Arch packages, SPDX SBOMs, a signed SHA-256 manifest, and an immutable container digest reference.
          EOF
          fi

          cat >> release-body.md <<'EOF'

          ```bash
          # Debian / Ubuntu / Mint / Raspbian
          sudo apt install ./goban_*.deb

          # Fedora / RHEL / Rocky / Alma
          sudo dnf install ./goban-*.rpm

          # Arch / Manjaro / EndeavourOS
          sudo pacman -U ./goban-*.pkg.tar.zst
          ```

          Verify downloaded assets in one directory with:

          ```bash
          cosign verify-blob \
            --bundle SHA256SUMS.sigstore.json \
            --certificate-identity-regexp 'https://github.com/izm1chael/goban/' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            SHA256SUMS
          sha256sum -c SHA256SUMS
          ```

          See the [README](https://github.com/izm1chael/goban#readme) for configuration, migration, privilege separation, and release-gate documentation.
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          name: GoBan ${{ github.ref_name }}
          generate_release_notes: true
          body_path: release-body.md
          prerelease: ${{ needs.metadata.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.metadata.outputs.prerelease == 'true' && 'false' || 'true' }}
          fail_on_unmatched_files: true
          preserve_order: true
          files: release-assets/*

  promote-latest:
    name: promote stable container latest
    if: needs.metadata.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    needs: [metadata, docker, release]
    steps:
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Point latest at the already-signed stable digest
        env:
          DIGEST: ${{ needs.docker.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$DIGEST"
          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:latest" \
            "${IMAGE_NAME}@${DIGEST}"
          docker buildx imagetools inspect "${IMAGE_NAME}:latest"
