# GoBan configuration — minimal example.
# See examples/rules.d/ for the bundled rule library.

log_level: info
sock_path: /run/goban/goban.sock
socket_mode: 0o660
socket_group: goban

# IPs in these CIDR ranges are NEVER banned. GoBan auto-adds each exact local
# interface address (/32 or /128), not the whole connected subnet. Add a
# management CIDR only when every host in that range is genuinely trusted;
# broad RFC1918 allowlists would otherwise exempt Docker and LAN attackers.
allowlist:
  - 127.0.0.0/8
  - ::1/128

# Bantime, findtime and max_retries each rule will inherit if it doesn't
# specify its own.
defaults:
  max_retries: 5
  findtime: 10m
  bantime: 1h

# Only enabled rule files belong here. Packages place the complete library in
# /usr/share/goban/rules-available/ so undefined sources cannot break a stock
# installation. Copy a bundle into this directory after defining its sources.
rules_dir: /etc/goban/rules.d

# Sources publish log lines. Each rule attaches to one named source.
sources:
  - type: file
    name: auth-log
    path: /var/log/auth.log

  # GoBan's own audit log — wired up so the bundled recidive rule (in
  # examples/rules.d/recidive.yaml) can escalate bans for repeat offenders.
  # The path here MUST match `audit_log` below.
  - type: file
    name: audit
    path: /var/log/goban/audit.log

  # Example docker source — uncomment when running alongside the named container.
  # - type: docker
  #   name: nextcloud-container
  #   container: nextcloud

  # Example journald source — only works when built with `make build-journald`.
  # - type: journal
  #   name: ssh-journal
  #   match: _SYSTEMD_UNIT=ssh.service

# Inline rules declared right here; for anything you'd reuse across hosts,
# put it in /etc/goban/rules.d/ instead.
rules: []

# When true, replays old log entries at startup. DANGEROUS on stale logs:
# a years-old auth.log will mass-ban everyone who ever failed a password.
# Leave at false unless you know what you're doing.
replay_on_start: false

# When true, ipset entries are flushed on graceful shutdown. Default false
# means bans persist across daemon restarts (the kernel keeps the set alive).
flush_on_exit: false

ipv6: true
ipset_name_v4: goban-ban-v4
ipset_name_v6: goban-ban-v6

# Banner backend — picks how bans are applied at the kernel level.
#   iptables  (default)  iptables + ipset, talks netlink direct to the ipset
#                        subsystem. Works on any Linux box with iptables-nft
#                        translation enabled (Debian 11+, RHEL 9+, etc).
#   nftables             native nftables via the NFNL_SUBSYS_NFTABLES
#                        netlink subsystem. Cleaner on pure-nftables hosts;
#                        operator must not also be running fail2ban with the
#                        iptables backend on the same chain.
banner:
  backend: iptables
  # INPUT protects host services; FORWARD covers bridged/routed workloads,
  # including normal Docker bridge traffic. Remove FORWARD only when another
  # firewall manager owns that chain and you have an equivalent custom hook.
  iptables_chains: [INPUT, FORWARD]
  # nftables-only knobs (ignored for iptables backend)
  table: goban
  set_v4: goban-ban-v4
  set_v6: goban-ban-v6
  chain: input
  forward_chain: forward

# Persistent strike state — in-flight strike counts survive a daemon restart.
# A determined attacker can't reset their progress by waiting for systemctl.
# Set state_path to empty to disable.
state_path: /var/lib/goban/state.gob
state_save_interval: 30s

# Audit log — appends one JSON line for every confirmed automatic or manual
# ban and every successful unban. Failed kernel operations are never recorded,
# so recidive and operator tooling consume an accurate applied-event stream.
audit_log: /var/log/goban/audit.log
