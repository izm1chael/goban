# vsftpd brute-force failures across common PAM/syslog prefixes.
rules:
  - name: vsftpd
    source: vsftpd-log
    regex: '(?:authentication failure;[^\n]*\brhost=(?P<ip>\[[0-9A-Fa-f:]+\]|[0-9A-Fa-f:.]+)|FAIL LOGIN: Client "(?P<ip>\[[0-9A-Fa-f:]+\]|[0-9A-Fa-f:.]+)")'
    max_retries: 5
    findtime: 10m
    bantime: 12h
