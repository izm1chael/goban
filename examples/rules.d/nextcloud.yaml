# Nextcloud login failures. The supported application log is JSON. The
# expression accepts either field order and extracts the address reported in
# the failed-login message or the structured remoteAddr field.
rules:
  - name: nextcloud-login
    source: nextcloud-container
    regex: '(?:"remoteAddr":"(?P<ip>[^"]+)"[^}]*"message":"Login failed:|"message":"Login failed:[^"}]*\(Remote IP: (?P<ip>[^)"\s]+)\)")'
    max_retries: 5
    findtime: 10m
    bantime: 1h

  - name: nextcloud-bruteforce
    source: nextcloud-container
    regex: '(?:"remoteAddr":"(?P<ip>[^"]+)"[^}]*"message":"[^"}]*[Bb]ruteforce|"message":"[^"}]*[Bb]ruteforce[^"}]*"[^}]*"remoteAddr":"(?P<ip>[^"]+)")'
    max_retries: 3
    findtime: 5m
    bantime: 6h
