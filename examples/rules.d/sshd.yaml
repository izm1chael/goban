# OpenSSH authentication failure protection.
#
# The core rule intentionally keys on terminal "Failed ..." authentication
# records rather than the earlier "Invalid user" preauth message, avoiding two
# strikes for one login attempt on distributions that emit both lines.
rules:
  - name: sshd
    source: auth-log
    regex: '(?:sshd(?:-session)?\[\d+\]: )?Failed (?:password|publickey|keyboard-interactive(?:/pam)?|none) for (?:invalid user )?\S+ from (?P<ip>\[[0-9A-Fa-f:]+\]|[0-9A-Fa-f:.]+)(?: port \d+)?(?: ssh\d)?(?: \[preauth\])?$'
    max_retries: 3
    findtime: 10m
    bantime: 24h

  - name: sshd-aggressive
    source: auth-log
    # Optional wider mode for scanners that never reach a terminal password
    # failure. It still excludes ordinary connection-close messages.
    regex: '(?:Invalid user \S+ from (?P<ip>\[[0-9A-Fa-f:]+\]|[0-9A-Fa-f:.]+)(?: port \d+)?|User \S+ from (?P<ip>\[[0-9A-Fa-f:]+\]|[0-9A-Fa-f:.]+) not allowed because .+|ROOT LOGIN REFUSED FROM (?P<ip>\[[0-9A-Fa-f:]+\]|[0-9A-Fa-f:.]+)(?: port \d+)?|error: PAM: [Aa]uthentication (?:failure|error) for \S+ from (?P<ip>\[[0-9A-Fa-f:]+\]|[0-9A-Fa-f:.]+))'
    max_retries: 5
    findtime: 10m
    bantime: 24h
