# nfpm package definition. One config builds both deb and rpm:
#   make package        # produces dist/goban_<ver>_amd64.deb and dist/goban-<ver>-1.x86_64.rpm
# Override version per release:
#   make package VERSION=1.2.3
#
# Hosting: attach the artifacts to GitHub Releases. No PPA/COPR repo yet.
name: goban
arch: ${ARCH}
platform: linux
version: ${VERSION}
version_schema: semver
section: net
priority: optional
maintainer: izm1chael <izm1chael@users.noreply.github.com>
description: |
  GoBan — lightweight host intrusion prevention.
  Watches log files, Docker container logs, and the systemd journal; bans
  offending IPs through direct netlink using ipset or nftables. Includes
  strict configuration validation, persisted state, and a Unix control API.
vendor: izm1chael
homepage: https://github.com/izm1chael/goban
license: MIT

# GoBan has no mandatory userspace firewall dependency when the native
# nftables backend is selected. The default iptables backend needs the
# iptables/ip6tables command only for one-time hook management; ipset hot-path
# operations use netlink directly. Keep iptables as a weak recommendation so
# minimal native-nftables installs stay minimal.
recommends:
  - iptables

# These are the files the package ships. Paths on the right are install
# destinations on the user's system.
contents:
  - src: ../bin/goban-daemon
    dst: /usr/bin/goban-daemon
    file_info:
      mode: 0755
  - src: ../bin/goban-enforcer
    dst: /usr/bin/goban-enforcer
    file_info:
      mode: 0755
  - src: ../bin/goban-client
    dst: /usr/bin/goban-client
    file_info:
      mode: 0755
  - src: ../bin/goban-corpus
    dst: /usr/bin/goban-corpus
    file_info:
      mode: 0755
  - src: ../bin/goban-soak
    dst: /usr/bin/goban-soak
    file_info:
      mode: 0755
  - src: ../deploy/goban.service
    dst: /usr/lib/systemd/system/goban.service
    file_info:
      mode: 0644
  - src: ../deploy/goban-enforcer.service
    dst: /usr/lib/systemd/system/goban-enforcer.service
    file_info:
      mode: 0644
  - src: ../examples/goban.yaml
    dst: /etc/goban/goban.yaml
    type: config|noreplace
    file_info:
      mode: 0640
  - dst: /etc/goban/rules.d
    type: dir
    file_info:
      mode: 0755
  - src: ../examples/rules.d
    dst: /usr/share/goban/rules-available
    type: tree
  - src: ../examples/rules.d/sshd.yaml
    dst: /etc/goban/rules.d/sshd.yaml
    type: config|noreplace
  - src: ../examples/rules.d/recidive.yaml
    dst: /etc/goban/rules.d/recidive.yaml
    type: config|noreplace
  - src: ../README.md
    dst: /usr/share/doc/goban/README.md
    file_info:
      mode: 0644
  - src: ../docs
    dst: /usr/share/doc/goban/docs
    type: tree
  - src: ../deploy/apparmor
    dst: /usr/share/goban/security/apparmor
    type: tree
  - src: ../deploy/selinux
    dst: /usr/share/goban/security/selinux
    type: tree
  - src: ../scripts/security
    dst: /usr/share/goban/security/scripts
    type: tree
  - src: ../deploy/goban-persist.service
    dst: /usr/lib/systemd/system/goban-persist.service
    file_info:
      mode: 0644
  - src: ../man/goban-daemon.8.gz
    dst: /usr/share/man/man8/goban-daemon.8.gz
    file_info:
      mode: 0644
  - src: ../man/goban-enforcer.8.gz
    dst: /usr/share/man/man8/goban-enforcer.8.gz
    file_info:
      mode: 0644
  - src: ../man/goban-client.1.gz
    dst: /usr/share/man/man1/goban-client.1.gz
    file_info:
      mode: 0644
  - src: ../man/goban-soak.1.gz
    dst: /usr/share/man/man1/goban-soak.1.gz
    file_info:
      mode: 0644

scripts:
  postinstall: ./postinst.sh
  preremove:   ./prerm.sh
  postremove:  ./postrm.sh
