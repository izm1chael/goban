# End-to-end smoke stack. The attacker repeatedly receives HTTP 401 responses
# from nginx until GoBan confirms a ban in the host FORWARD chain; subsequent
# requests time out. Run from the repository root:
#   docker compose -f deploy/docker-compose.yml up --build
# Inspect:
#   docker compose -f deploy/docker-compose.yml exec goban goban-client sources
#   docker compose -f deploy/docker-compose.yml exec goban goban-client list
services:
  goban:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: goban:latest
    container_name: goban
    network_mode: host
    cap_add: [NET_ADMIN]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./smoke/goban.yaml:/etc/goban/goban.yaml:ro
      - goban-run:/run/goban
      - goban-state:/var/lib/goban
      - goban-log:/var/log/goban
    restart: unless-stopped

  victim:
    image: nginx:alpine
    container_name: goban-victim
    volumes:
      - ./smoke/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped

  attacker:
    image: alpine:3.20
    container_name: goban-attacker
    depends_on: [victim, goban]
    command: ["/bin/sh", "-c", "apk add --no-cache curl >/dev/null && while true; do date; curl --max-time 2 -sS -o /dev/null -w '%{http_code}\n' http://victim:8088/ || echo blocked; sleep 1; done"]
    restart: unless-stopped

volumes:
  goban-run:
  goban-state:
  goban-log:
